name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: br-dl-win.exe
            asset_name: br-dl-windows.exe
          - os: ubuntu-latest
            artifact_name: br-download-manager-rs
            asset_name: br-dl-linux
          - os: macos-latest
            artifact_name: br-download-manager-rs
            asset_name: br-dl-macos

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release
      - name: Prepare Artifacts
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/release/br-download-manager-rs.exe ${{ matrix.asset_name }}
          else
            mv target/release/br-download-manager-rs ${{ matrix.asset_name }}
          fi
        shell: bash
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            br-dl-windows.exe
            br-dl-linux
            br-dl-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
