<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary, #1a1b1e);
      color: var(--text-primary, #e1e1e3);
      padding: 20px;
    }
    @media (prefers-color-scheme: light) {
      body { background: #fff; color: #212529; }
      .info-box { background: #f8f9fa; border-color: #e9ecef; }
      .filename { color: #333; }
      .meta { color: #6c757d; }
    }
    h2 { font-size: 15px; margin-bottom: 12px; }
    .info-box {
      background: #25262b;
      border: 1px solid #373a40;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .filename { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .meta { font-size: 11px; color: #909296; }
    .buttons { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:active { transform: scale(0.97); }
    .btn-resume { background: #2b8a3e; color: #fff; }
    .btn-resume:hover { background: #37b24d; }
    .btn-new { background: #373a40; color: #e1e1e3; }
    .btn-new:hover { background: #495057; }
  </style>
</head>
<body>
  <h2>Download ditemukan</h2>
  <div class="info-box">
    <div class="filename" id="filename"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="buttons">
    <button class="btn-resume" id="resume">Lanjutkan</button>
    <button class="btn-new" id="new">Download Baru</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('filename').textContent = params.get('filename') || 'Unknown';
    const mb = params.get('mb') || '0';
    document.getElementById('meta').textContent = `${mb}MB sudah terdownload - pilih aksi`;

    document.getElementById('resume').onclick = () => {
      chrome.runtime.sendMessage({action: 'resumeChoice', choice: 'resume'});
      window.close();
    };
    document.getElementById('new').onclick = () => {
      chrome.runtime.sendMessage({action: 'resumeChoice', choice: 'new'});
      window.close();
    };
  </script>
</body>
</html>
